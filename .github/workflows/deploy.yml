name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  security-gate:
    permissions:
      security-events: read
    runs-on: ubuntu-latest
    steps:
      - name: Block deploy on open security alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! scans=$(gh api "repos/ttyyjjkkoott/bloomproof/code-scanning/alerts?state=open&per_page=100" --paginate --jq '.[] | "\(.rule.severity // "?") \(.rule.id // "?") \(.most_recent_instance.location.path // "?"):\(.most_recent_instance.location.start_line // "?")"'); then
            echo "code-scanning alerts API failed, blocking deploy"
            exit 1
          fi
          if [ -n "$scans" ]; then
            echo "Blocking deploy: open code-scanning alert(s):"
            printf '%s\n' "$scans" | sed 's/^/  /'
            exit 1
          fi
          echo "No open code-scanning alerts"
  build:
    needs: security-gate
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Audit dependencies
        working-directory: site
        run: npm audit --audit-level=moderate

      - name: Run tests
        working-directory: site
        run: npm test

      - name: Build
        working-directory: site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    needs:
      - build
      - security-gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
