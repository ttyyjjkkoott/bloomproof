name: Validate entry

on:
  pull_request:
    paths:
      - 'entries/*.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate changed entries
        id: validate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'EOF'
          import ipaddress
          import os
          import re
          import socket
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          REQUIRED = ['Problem', 'Solution', 'Artifact', 'Human', 'License']
          UA = {'User-Agent': 'Mozilla/5.0 (compatible; BloomProofValidator/1.0)'}

          # SSRF guard: PR-submitted URLs are untrusted. Resolve every host
          # before fetching and refuse private/internal addresses outright —
          # loopback, link-local (including the 169.254.169.254 cloud metadata
          # endpoint), RFC 1918, and other non-public ranges. Redirect targets
          # are re-checked the same way, so a public URL cannot bounce the
          # checker into the internal network. A blocked URL fails the check
          # loudly instead of being fetched.
          def host_blocked(url):
              try:
                  host = urllib.parse.urlparse(url).hostname
              except Exception:
                  return 'BLOCKED private/internal address: unparseable URL'
              if not host:
                  return 'BLOCKED private/internal address: missing hostname'
              try:
                  infos = socket.getaddrinfo(host, None)
              except socket.gaierror as e:
                  return f'DNS resolution failed: {e}'
              for info in infos:
                  ip = ipaddress.ip_address(info[4][0])
                  if (ip.is_loopback or ip.is_link_local or ip.is_private
                          or ip.is_reserved or ip.is_multicast or ip.is_unspecified):
                      return f'BLOCKED private/internal address: {host} resolves to {ip}'
              return None

          class BlockPrivateRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  reason = host_blocked(urllib.parse.urljoin(req.full_url, newurl))
                  if reason is not None:
                      raise urllib.error.URLError(reason)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          _opener = urllib.request.build_opener(BlockPrivateRedirect())

          def clean(raw):
              return raw.rstrip('.,;:!?\'"*_~)')

          def fetch(url):
              reason = host_blocked(url)
              if reason is not None:
                  return None, reason
              try:
                  req = urllib.request.Request(url, headers=UA, method='GET')
                  with _opener.open(req, timeout=20) as resp:
                      return resp.status, None
              except Exception as e:
                  return None, f'{type(e).__name__}: {e}'

          base = os.environ['BASE_SHA']
          out = subprocess.run(
              ['git', 'diff', '--name-status', f'{base}...HEAD', '--', 'entries/*.md'],
              capture_output=True, text=True, check=True)
          # Top-level entries only: failed/ holds intentionally unpublished records.
          # Deleted files are skipped so unpublishing never fails a check.
          # Added/renamed files get the filename check; edits to existing files don't.
          files = []
          for line in out.stdout.splitlines():
              parts = line.split('\t')
              status, path = parts[0], parts[-1]
              if status == 'D':
                  continue
              if not re.match(r'^entries/[^/]+\.md$', path):
                  continue
              files.append((path, status.startswith('A') or status.startswith('R')))
          files.sort()

          tree = subprocess.run(
              ['git', 'ls-tree', '-r', '--name-only', base, '--', 'entries'],
              capture_output=True, text=True, check=True)
          used = set()
          for p in tree.stdout.split():
              m0 = re.match(r'^entries/(?:failed/)?(\d+)-[^/]+\.md$', p)
              if m0:
                  used.add(int(m0.group(1)))
          next_num = max(used) + 1 if used else 1

          report = ['## Entry validation', '']
          failures = 0

          if not files:
              report.append('No entry files changed in this PR.')
          for path, is_new in files:
              if path == 'entries/template.md':
                  report.append(f'### `{path}`')
                  report.append('- Skipped: the template holds empty slots by design, not a real entry.')
                  report.append('')
                  continue
              report.append(f'### `{path}`')
              try:
                  text = open(path, encoding='utf-8').read()
              except OSError as e:
                  report.append(f'- :x: Could not read file: {e}')
                  failures += 1
                  continue

              if is_new:
                  if re.match(r'^entries/draft-[A-Za-z0-9][A-Za-z0-9._-]*\.md$', path):
                      report.append('- :white_check_mark: Draft filename — the maintainer assigns the number on merge')
                  else:
                      mnum = re.match(r'^entries/(\d+)-[^/]+\.md$', path)
                      if mnum and int(mnum.group(1)) == next_num:
                          report.append(f'- :white_check_mark: Numbered filename (next unused number {next_num:03d})')
                      else:
                          report.append(f'- :x: New entries must be named `entries/draft-<slug>.md` or `entries/{next_num:03d}-<slug>.md`')
                          failures += 1

              missing = [s for s in REQUIRED
                         if not re.search(rf'^##\s+{s}\s*$', text, re.M)]
              if missing:
                  report.append(f"- :x: Missing sections: {', '.join('## ' + s for s in missing)}")
                  failures += 1
              else:
                  report.append('- :white_check_mark: All five sections present (Problem, Solution, Artifact, Human, License)')

              checked = {}

              def report_url(label, match):
                  url = clean(match.group(1))
                  code, err = fetch(url)
                  checked[url] = True
                  if code == 200:
                      report.append(f'- :white_check_mark: `{label}:` `{url}` → HTTP 200')
                  elif code is None:
                      report.append(f'- :x: `{label}:` `{url}` → unreachable ({err})')
                  else:
                      report.append(f'- :x: `{label}:` `{url}` → HTTP {code} (expected 200)')
                  return code == 200

              code_m = re.search(r'^-\s*Code:\s*(https?://\S+)', text, re.M)
              live_m = re.search(r'^-\s*Live site:\s*(https?://\S+)', text, re.M)
              app_m = re.search(r'^-\s*App:\s*(https?://\S+)', text, re.M)

              if not code_m:
                  report.append('- :x: No `Code:` URL found')
                  failures += 1
              elif not report_url('Code', code_m):
                  failures += 1

              live_count = bool(live_m) + bool(app_m)
              if live_count > 1:
                  report.append('- :x: Must contain at most one of `Live site:` / `App:` (found both)')
                  failures += 1
              for label, match in [('Live site', live_m), ('App', app_m)]:
                  if match and not report_url(label, match):
                      failures += 1

              m = re.search(r'^##\s+Artifact\s*$(.*?)(?=^##\s|\Z)', text, re.M | re.S)
              urls = []
              if m:
                  for raw in re.findall(r'https?://[^\s)<>\]]+', m.group(1)):
                      url = clean(raw)
                      if url not in checked:
                          urls.append(url)
              if not urls and not checked:
                  report.append('- :x: No http(s) URL found in the Artifact section')
                  failures += 1
              for url in urls:
                  code, err = fetch(url)
                  if code == 200:
                      report.append(f'- :white_check_mark: `{url}` → HTTP 200')
                  elif code is None:
                      report.append(f'- :x: `{url}` → unreachable ({err})')
                      failures += 1
                  else:
                      report.append(f'- :x: `{url}` → HTTP {code} (expected 200)')
                      failures += 1
              report.append('')

          report.append('**Result: PASS**' if failures == 0 else f'**Result: FAIL ({failures} problem(s))**')
          body = '\n'.join(report)
          print(body)
          with open('validation-report.md', 'w', encoding='utf-8') as f:
              f.write(body + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(body + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"failures={failures}\n")
          EOF

      - name: Comment results on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file validation-report.md

      - name: Fail on problems
        if: steps.validate.outputs.failures != '0'
        run: exit 1
